global:
  scrape_interval: 5s   # brief: admin needs degradation visible within seconds

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]
  # Microservices (orders, inventory, payments, catalog, gateway) added as they land.
